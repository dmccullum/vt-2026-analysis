<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive School Redistricting Data</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/x-icon" href="https://files.vcgi.vermont.gov/logo/favicon.ico">

    <meta property="og:title" content="School Redistricting Task Force | Data Requests">
    <meta property="og:description" content="An interactive viewer for data requests related to the Vermont School Redistricting Task Force.">
    <meta property="og:image" content="https://map.vermont.gov/education/redistricting-data-requests/dreq.jpg">
    <meta property="og:url" content="https://map.vermont.gov/education/redistricting-data-requests/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="School Redistricting Task Force | Data Requests">
    <meta name="twitter:description" content="An interactive viewer for data requests related to the Vermont School Redistricting Task Force.">
    <meta name="twitter:image" content="https://map.vermont.gov/education/redistricting-data-requests/dreq.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9C6KC5B51H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-9C6KC5B51H');
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Style for section headers */
        .section-header td {
            background-color: #f9fafb;
            font-weight: 600;
            color: #11182c;
            border-bottom: 2px solid #e5e7eb;
        }
        /* Status Dots */
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-green { background-color: #22c55e; } /* Original Bright Green */
        .dot-yellow { background-color: #D8A25D; } /* Muted Yellow */
        .dot-red { background-color: #D98C8C; } /* Muted Red */
        .dot-default { background-color: #9ca3af; } /* gray-400 */

        /* Row hover effect */
        #dataTableBody tr.data-row:hover {
            background-color: #f9fafb;
        }
        
        /* Collapsible content */
        .collapsible-content {
            background-color: #f8fafc; /* A slightly different bg for contrast */
        }
        .collapsible-content td {
            padding: 0 !important;
        }
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.25rem;
        }
        
        .toggle-btn svg {
            transition: transform 0.2s ease-in-out;
        }
        .toggle-btn.open svg {
            transform: rotate(180deg);
        }
        table {
            table-layout: fixed;
            word-wrap: break-word;
        }

        /* Filter Buttons */
        .filter-btn {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            background-color: #e5e7eb;
            color: #4b5563;
            transition: background-color 0.2s, color 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
        }
        .filter-btn:hover {
            background-color: #d1d5db;
        }
        .filter-btn.active {
            background-color: #225d39; /* Updated active color */
            color: #ffffff;
        }
        
        /* Accessibility class for screen readers */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 sm:p-6 lg:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg p-6 sm:p-8">
        <header class="mb-8 border-b border-gray-200 pb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">School Redistricting Task Force</h1>
            <p class="text-gray-500 mt-2">Data Requests</p>
        </header>

        <div id="filter-buttons" class="flex flex-wrap gap-2 mb-6">
            </div>

        <div class="mb-6">
            <label for="searchInput" class="sr-only">Search data requests</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                    </svg>
                </div>
                <input type="text" id="searchInput" placeholder="Search requests..." class="block w-full bg-gray-50 pl-10 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
            </div>
        </div>

        <div class="overflow-x-auto border border-gray-200 rounded-lg">
            <table class="min-w-full">
                <tbody id="dataTableBody" class="bg-white">
                    </tbody>
            </table>
        </div>
        <div id="no-results" class="text-center py-10 text-gray-500 hidden">
            <p class="text-lg font-medium">No results found.</p>
            <p>Try adjusting your search terms.</p>
        </div>
    </div>

    <script>
        let liveJsonData = {}; // To store the original section structure from the fetch
        let parsedData = [];
        let activeSectionFilter = 'All';
        
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            document.getElementById('searchInput').addEventListener('input', handleSearch);
            document.getElementById('dataTableBody').addEventListener('click', handleToggle);
        });
        
        async function loadData() {
            const tableBody = document.getElementById('dataTableBody');
            tableBody.innerHTML = '<tr><td colspan="3" class="text-center p-8 text-gray-500">Loading data...</td></tr>';
            try {
                const response = await fetch('https://vtopendata-prd.s3.us-east-2.amazonaws.com/_Other/Education/data-request.json', {
                    cache: 'no-cache' 
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                liveJsonData = await response.json();
                if (liveJsonData && typeof liveJsonData === 'object' && !Array.isArray(liveJsonData)) {
                    parsedData = parseJSON(liveJsonData);
                    setupFilterButtons();
                    renderTable(parsedData);
                } else {
                     throw new Error("JSON data is not in the expected format (expected an object of sections).");
                }
            } catch (error) {
                console.error("Failed to load data:", error);
                tableBody.innerHTML = `<tr><td colspan="3" class="text-center p-8 text-red-500">Failed to load data: ${error.message}. Please check the data source and try again.</td></tr>`;
            }
        }

        function setupFilterButtons() {
            const container = document.getElementById('filter-buttons');
            const sections = Object.keys(liveJsonData);
            let buttonsHTML = `<button class="filter-btn active" data-section="All">All</button>`;
            sections.forEach(section => {
                buttonsHTML += `<button class="filter-btn" data-section="${section}">${section}</button>`;
            });
            container.innerHTML = buttonsHTML;
            container.addEventListener('click', handleFilterClick);
        }

        function handleFilterClick(event) {
            const button = event.target.closest('.filter-btn');
            if (!button) return;

            activeSectionFilter = button.dataset.section;

            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            processAndRender();
        }

        function getStatusDot(status) {
            const lowerStatus = (status || '').toLowerCase();
            let dotClass = 'dot-default';
            let statusText = status || 'Not specified';

            if (lowerStatus.startsWith('yes')) dotClass = 'dot-green';
            else if (lowerStatus.startsWith('no')) dotClass = 'dot-red';
            else if (lowerStatus.startsWith('alternative')) dotClass = 'dot-yellow';

            return `<div class="flex justify-center" title="${status || ''}">
                        <div class="status-dot ${dotClass}"></div>
                        <span class="sr-only">Status: ${statusText}</span>
                    </div>`;
        }

        function renderLink(link) {
            if (typeof link === 'string' && (link.startsWith('http://') || link.startsWith('https://'))) {
                let linkText = link;
                if (link.startsWith('https://map.vermont.gov')) {
                    try {
                        const filename = link.substring(link.lastIndexOf('/') + 1);
                        if (filename) {
                            linkText = decodeURIComponent(filename);
                        } else if (link.startsWith('https://map.vermont.gov/education/')) {
                            linkText = 'https://map.vermont.gov/education/';
                        }
                    } catch (e) {
                        linkText = link; // Fallback to full URL on error
                    }
                }
                return `<a href="${link}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline hover:text-blue-800 transition-colors">${linkText}</a>`;
            }
            return link ? String(link) : '';
        }

        function parseJSON(data) {
            let flattenedData = [];
            for (const sectionName in data) {
                if (Object.prototype.hasOwnProperty.call(data, sectionName)) {
                    flattenedData.push({ isSectionHeader: true, 'Data Request': sectionName });
                    const requests = data[sectionName];
                    let lastValidRequest = null;

                    if (Array.isArray(requests)) {
                        requests.forEach(row => {
                            if (row['Data Request']) {
                                row.section = sectionName;
                                const allLinks = [];
                                // FIX: Handle arrays, comma-separated strings, and single strings for Links
                                if (Array.isArray(row.Link)) {
                                    allLinks.push(...row.Link.map(l => l.trim()));
                                } else if (typeof row.Link === 'string' && row.Link.includes(',')) {
                                    allLinks.push(...row.Link.split(',').map(l => l.trim()));
                                } else if (row.Link) {
                                    allLinks.push(row.Link);
                                }
                                
                                const newRow = { 
                                    ...row, 
                                    isSectionHeader: false, 
                                    allLinks: allLinks
                                };
                                delete newRow.Link;

                                flattenedData.push(newRow);
                                lastValidRequest = newRow;
                            } else if (row.Link && lastValidRequest) {
                                // FIX: Also handle different link formats for subsequent rows that are part of a previous request
                                if (Array.isArray(row.Link)) {
                                    lastValidRequest.allLinks.push(...row.Link.map(l => l.trim()));
                                } else if (typeof row.Link === 'string' && row.Link.includes(',')) {
                                    lastValidRequest.allLinks.push(...row.Link.split(',').map(l => l.trim()));
                                } else {
                                    lastValidRequest.allLinks.push(row.Link);
                                }
                            }
                        });
                    }
                }
            }
            return flattenedData;
        }
        
        function renderTable(data) {
            const tableBody = document.getElementById('dataTableBody');
            const noResultsDiv = document.getElementById('no-results');
            if (!data.some(d => !d.isSectionHeader)) {
                tableBody.innerHTML = '';
                noResultsDiv.classList.remove('hidden');
                return;
            }
            noResultsDiv.classList.add('hidden');
            let tableHTML = '';
            data.forEach((row) => {
                const uniqueId = (row['Data Request'] + (row.section || '')).replace(/[^a-zA-Z0-9]/g, '');

                if (row.isSectionHeader) {
                    tableHTML += `<tr class="section-header"><td colspan="3" class="px-6 py-3 text-sm">${row['Data Request']}</td></tr>`;
                } else {
                    const allLinks = row.allLinks || [];
                    const hasLinks = allLinks.length > 0;
                    tableHTML += `
                        <tr class="data-row" data-toggle-id="${uniqueId}">
                            <td class="w-12 pl-4 align-middle">
                                <button class="toggle-btn p-2 rounded-full hover:bg-gray-100 focus:outline-none" aria-expanded="false" aria-controls="details-${uniqueId}" aria-label="Show details for ${row['Data Request']}">
                                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </button>
                            </td>
                            <td class="w-12 py-4 align-middle">
                                ${getStatusDot(row['Availability'])}
                            </td>
                            <td class="px-6 py-4 align-middle">
                                <div class="text-sm font-medium text-gray-900">${row['Data Request']}</div>
                                <div class="text-xs text-gray-500 mt-1">${row['Scope / Timeframe']}</div>
                            </td>
                        </tr>
                        <tr class="collapsible-content hidden" id="details-${uniqueId}" data-content-id="${uniqueId}">
                           <td colspan="3">
                                <div class="flex">
                                    <div class="w-24 flex-shrink-0"></div>
                                    <div class="flex-grow pl-6 pr-6 py-4 border-l-4 border-gray-200">
                                        <div class="details-grid">
                                            <div>
                                                <h4 class="text-xs font-semibold text-gray-500 uppercase">Availability</h4>
                                                <p class="text-sm text-gray-800 mt-1">${row['Availability'] || 'N/A'}</p>
                                            </div>
                                            <div>
                                                <h4 class="text-xs font-semibold text-gray-500 uppercase">Source(s)</h4>
                                                <p class="text-sm text-gray-800 mt-1">${row['Source(s)'] || 'N/A'}</p>
                                            </div>
                                            <div>
                                                <h4 class="text-xs font-semibold text-gray-500 uppercase">Content Type</h4>
                                                <p class="text-sm text-gray-800 mt-1">${row['Content Type'] || 'N/A'}</p>
                                            </div>
                                            <div>
                                                <h4 class="text-xs font-semibold text-gray-500 uppercase">Expected Delivery</h4>
                                                <p class="text-sm text-gray-800 mt-1">${row['Expected Delivery'] || 'N/A'}</p>
                                            </div>
                                            ${row['Notes'] ? `
                                            <div class="col-span-1 sm:col-span-3">
                                                <h4 class="text-xs font-semibold text-gray-500 uppercase">Notes</h4>
                                                <p class="text-sm text-gray-800 mt-1">${row['Notes']}</p>
                                            </div>` : ''}
                                            ${hasLinks ? `
                                            <div class="col-span-1 sm:col-span-3">
                                                <h4 class="text-xs font-semibold text-gray-500 uppercase">Links</h4>
                                                <div class="text-sm text-gray-800 mt-1 space-y-1">
                                                    ${allLinks.map(link => `<div>${renderLink(link)}</div>`).join('')}
                                                </div>
                                                <p class="text-xs text-gray-600 mt-3">
                                                    <strong>Note:</strong> Some browsers may open data files in a new tab. To download, <strong>right-click</strong> the link and select <strong>"Save Link As..."</strong>.
                                                </p>
                                            </div>` : ''}
                                        </div>
                                    </div>
                                </div>
                           </td>
                        </tr>`;
                }
            });
            tableBody.innerHTML = tableHTML;
        }
        
        function handleToggle(event) {
            const button = event.target.closest('.toggle-btn');
            if (!button) return;
            
            const row = button.closest('tr');
            const toggleId = row.dataset.toggleId;
            const contentRow = document.querySelector(`[data-content-id="${toggleId}"]`);
            
            if (contentRow) {
                const isExpanded = button.getAttribute('aria-expanded') === 'true';
                button.setAttribute('aria-expanded', !isExpanded);
                button.classList.toggle('open');
                contentRow.classList.toggle('hidden');
            }
        }

        function handleSearch() {
            processAndRender();
        }
        
        function processAndRender() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            let dataToRender = [...parsedData];

            // 1. Filter by section
            if (activeSectionFilter !== 'All') {
                dataToRender = dataToRender.filter(row => 
                    (row.isSectionHeader && row['Data Request'] === activeSectionFilter) || row.section === activeSectionFilter
                );
            }

            // 2. Filter by search term
            if (searchTerm) {
                const dataRows = dataToRender.filter(row => !row.isSectionHeader);
                const matchingRows = dataRows.filter(row => 
                    Object.values(row).some(value => {
                        if (Array.isArray(value)) {
                            return value.some(item => String(item).toLowerCase().includes(searchTerm));
                        }
                        return String(value).toLowerCase().includes(searchTerm);
                    })
                );
                
                const finalFiltered = [];
                const sectionsWithMatches = {};
                matchingRows.forEach(row => {
                    if (!sectionsWithMatches[row.section]) {
                        sectionsWithMatches[row.section] = [];
                    }
                    sectionsWithMatches[row.section].push(row);
                });
                
                // Rebuild list using the original section order from liveJsonData
                for (const sectionName in liveJsonData) {
                    if (sectionsWithMatches[sectionName] && (activeSectionFilter === 'All' || activeSectionFilter === sectionName)) {
                        finalFiltered.push({ isSectionHeader: true, 'Data Request': sectionName });
                        finalFiltered.push(...sectionsWithMatches[sectionName]);
                    }
                }
                dataToRender = finalFiltered;
            }
            
            renderTable(dataToRender);
        }
    </script>
</body>
</html>
